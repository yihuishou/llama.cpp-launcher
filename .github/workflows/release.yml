name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Prepare artifacts
        shell: pwsh
        run: |
          # 从 Cargo.toml 读取版本号
          $toml = Get-Content "Cargo.toml" -Raw
          if ($toml -match 'version\s*=\s*"([^"]+)"') {
            $version = $Matches[1]
          } else {
            Write-Error "无法从 Cargo.toml 读取版本号"
            exit 1
          }
          Write-Host "检测到版本号: $version"

          New-Item -ItemType Directory -Path "dist" -Force
          $exeName = "llama_cpp_launcher_v${version}.exe"
          Copy-Item "target/release/llama_cpp_launcher.exe" -Destination "dist/$exeName"
          Write-Host "已重命名为: $exeName"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-launcher-windows
          path: dist/

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Build release
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Prepare artifacts
        shell: pwsh
        run: |
          # 从 Cargo.toml 读取版本号
          $toml = Get-Content "Cargo.toml" -Raw
          if ($toml -match 'version\s*=\s*"([^"]+)"') {
            $version = $Matches[1]
          } else {
            Write-Error "无法从 Cargo.toml 读取版本号"
            exit 1
          }
          Write-Host "检测到版本号: $version"

          New-Item -ItemType Directory -Path "dist" -Force
          $exeName = "llama_cpp_launcher_v${version}_arm64.exe"
          Copy-Item "target/aarch64-pc-windows-msvc/release/llama_cpp_launcher.exe" -Destination "dist/$exeName"
          Write-Host "已重命名为: $exeName"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-launcher-windows-arm64
          path: dist/

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure cargo for cross-compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        run: |
          # 从 Cargo.toml 读取版本号
          VERSION=$(awk -F '"' '/^\[package\]/ {p=1} p && /^version/ {print $2; exit}' Cargo.toml | tr -d '\n\r')
          echo "检测到版本号: $VERSION"

          mkdir -p dist

          ARCHIVE_NAME="llama_cpp_launcher_v${VERSION}_linux_${{ matrix.arch }}"

          # 包内二进制使用固定文件名：桌面快捷方式 / XDG autostart 里存的是
          # Exec=<绝对路径>，若二进制名带版本号，每次升级后旧路径都会失效。
          # 版本号只体现在压缩包名上，解压覆盖后快捷方式始终有效。
          cp "target/${{ matrix.target }}/release/llama_cpp_launcher" "dist/llama-cpp-launcher"
          chmod +x "dist/llama-cpp-launcher"

          # 创建 tar.gz
          cd dist
          tar czf "${ARCHIVE_NAME}.tar.gz" "llama-cpp-launcher"
          rm "llama-cpp-launcher"

          echo "已创建: ${ARCHIVE_NAME}.tar.gz（包内二进制名: llama-cpp-launcher）"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-launcher-linux-${{ matrix.arch }}
          path: dist/

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare .app bundle
        run: |
          # 从 Cargo.toml 读取版本号
          VERSION=$(awk -F '"' '/^\[package\]/ {p=1} p && /^version/ {print $2; exit}' Cargo.toml | tr -d '\n\r')
          echo "检测到版本号: $VERSION"

          APP_NAME="LlamaLauncher"
          APP_DIR="dist/${APP_NAME}.app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"

          # 可执行文件
          cp "target/${{ matrix.target }}/release/llama_cpp_launcher" "${APP_DIR}/Contents/MacOS/llama_cpp_launcher"
          chmod +x "${APP_DIR}/Contents/MacOS/llama_cpp_launcher"

          # Info.plist（应用名/标识/版本，与主程序 app_id 保持一致）
          cat > "${APP_DIR}/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Llama Launcher</string>
            <key>CFBundleDisplayName</key><string>Llama Launcher</string>
            <key>CFBundleIdentifier</key><string>com.yihuishou.llama_cpp_launcher</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>llama_cpp_launcher</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # ditto 打包成 zip，保留可执行权限与 .app 目录结构
          ZIP_NAME="llama_cpp_launcher_v${VERSION}_macos_${{ matrix.arch }}.app.zip"
          ditto -c -k --keepParent "${APP_DIR}" "dist/${ZIP_NAME}"
          rm -rf "${APP_DIR}"

          echo "已创建: ${ZIP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-launcher-macos-${{ matrix.arch }}
          path: dist/

  release:
    needs: [ build-windows, build-windows-arm64, build-linux, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-cpp-launcher-windows
          path: dist/

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-cpp-launcher-windows-arm64
          path: dist/

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-cpp-launcher-linux-x86_64
          path: dist/

      - name: Download Linux aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-cpp-launcher-linux-aarch64
          path: dist/

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-cpp-launcher-macos-x86_64
          path: dist/

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-cpp-launcher-macos-arm64
          path: dist/


      - name: List artifacts
        run: ls -la dist/

      - name: Generate detailed changelog
        id: changelog
        run: |
          # 获取当前 tag
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          echo "当前版本: $CURRENT_TAG"
          
          # 获取上一个 tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${CURRENT_TAG}^ 2>/dev/null || echo "")
          echo "上一个版本: $PREVIOUS_TAG"
          
          # 生成 changelog
          CHANGELOG="## What's Changed\n\n"
          
          if [ -z "$PREVIOUS_TAG" ]; then
            # 没有上一个 tag，显示所有 commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
            CHANGELOG+="### Commits\n${COMMITS}\n"
          else
            # 获取两个 tag 之间的 commits
            echo "获取 $PREVIOUS_TAG 到 $CURRENT_TAG 之间的变更..."
          
            # 获取所有 commits
            COMMITS=$(git log ${PREVIOUS_TAG}..${CURRENT_TAG} --pretty=format:"- %s (%h)")
          
            # 按类型分类 commits
            FEATURES=$(echo "$COMMITS" | grep -i "^- feat" || true)
            FIXES=$(echo "$COMMITS" | grep -i "^- fix" || true)
            DOCS=$(echo "$COMMITS" | grep -i "^- docs" || true)
            REFACTOR=$(echo "$COMMITS" | grep -i "^- refactor" || true)
            PERF=$(echo "$COMMITS" | grep -i "^- perf" || true)
            TEST=$(echo "$COMMITS" | grep -i "^- test" || true)
            CHORE=$(echo "$COMMITS" | grep -i "^- chore\|^- build\|^- ci" || true)
            OTHER=$(echo "$COMMITS" | grep -vi "^- feat\|^- fix\|^- docs\|^- refactor\|^- perf\|^- test\|^- chore\|^- build\|^- ci" || true)
          
            # 构建 changelog
            if [ -n "$FEATURES" ]; then
              CHANGELOG+="### 🚀 Features\n${FEATURES}\n\n"
            fi
          
            if [ -n "$FIXES" ]; then
              CHANGELOG+="### 🐛 Bug Fixes\n${FIXES}\n\n"
            fi
          
            if [ -n "$DOCS" ]; then
              CHANGELOG+="### 📚 Documentation\n${DOCS}\n\n"
            fi
          
            if [ -n "$REFACTOR" ]; then
              CHANGELOG+="### ♻️ Refactoring\n${REFACTOR}\n\n"
            fi
          
            if [ -n "$PERF" ]; then
              CHANGELOG+="### ⚡ Performance\n${PERF}\n\n"
            fi
          
            if [ -n "$TEST" ]; then
              CHANGELOG+="### ✅ Tests\n${TEST}\n\n"
            fi
          
            if [ -n "$CHORE" ]; then
              CHANGELOG+="### 🔧 Maintenance\n${CHORE}\n\n"
            fi
          
            if [ -n "$OTHER" ]; then
              CHANGELOG+="### 📦 Other Changes\n${OTHER}\n\n"
            fi
          
            # 添加贡献者列表
            CHANGELOG+="### 👥 Contributors\n\n"
            CONTRIBUTORS=$(git log ${PREVIOUS_TAG}..${CURRENT_TAG} --pretty=format:"- @%an" | sort -u)
            CHANGELOG+="${CONTRIBUTORS}\n"
          fi
          
          # 保存到文件
          echo -e "$CHANGELOG" > CHANGELOG.md
          echo "Changelog 已生成"
          cat CHANGELOG.md
          
          # 设置输出
          echo "path=CHANGELOG.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: CHANGELOG.md
          generate_release_notes: true
